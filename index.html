<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo RedNatura</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>Catálogo RedNatura</h1>
    <p>Descubre nuestros productos y sucursales</p>
  </header>

  <main>
    <!-- Sección de productos -->
    <section id="productos">
      <!-- Aquí se insertan dinámicamente las tarjetas desde productos.js -->
    </section>

    <!-- Sección del chatbot -->
    <section id="chatbot">
      <h2>Asistente RedNatura</h2>
      <div id="chat-window"></div>
      <div id="chat-controls">
        <input type="text" id="chat-input" placeholder="Escribe aquí...">
        <button id="send-btn">Enviar</button>
      </div>
    </section>

    <!-- Formulario de registro para compra -->
    <section id="registro" style="display:none;">
      <h2>Registro de compra</h2>
      <form id="registro-form">
        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <label>Apellidos:</label>
        <input type="text" id="apellidos" required>
        <label>Teléfono:</label>
        <input type="tel" id="telefono" required>
        <label>Lugar de nacimiento:</label>
        <input type="text" id="lugar" required>
        <label>Fecha de nacimiento:</label>
        <input type="date" id="fecha" required>
        <button type="submit">Enviar registro</button>
      </form>
      <p>🎁 Al registrarte obtienes <strong>30% de descuento</strong> en compras mayores a $350 MXN.</p>
    </section>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>© 2026 RedNatura - Todos los derechos reservados</p>
  </footer>

  <!-- Scripts -->
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
