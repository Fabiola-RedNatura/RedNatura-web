<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo RedNatura</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header>
    <h1>Catálogo RedNatura</h1>
    <p>Descubre nuestros productos y sucursales</p>
  </header>

  <main>
    <!-- Filtros de categorías -->
    <nav id="filtros">
      <button class="filtro-btn active" onclick="filtrarProductos('todos', this)">Todos</button>
      <button class="filtro-btn" onclick="filtrarProductos('Niños', this)">Niños</button>
      <button class="filtro-btn" onclick="filtrarProductos('Mujeres', this)">Mujeres</button>
      <button class="filtro-btn" onclick="filtrarProductos('Hombres', this)">Hombres</button>
      <button class="filtro-btn" onclick="filtrarProductos('Belleza', this)">Belleza</button>
      <button class="filtro-btn" onclick="filtrarProductos('Digestión', this)">Digestión</button>
      <button class="filtro-btn" onclick="filtrarProductos('Energía', this)">Energía</button>
      <button class="filtro-btn" onclick="filtrarProductos('Inmunológico', this)">Inmunológico</button>
      <button class="filtro-btn" onclick="filtrarProductos('Articulaciones', this)">Articulaciones</button>
      <button class="filtro-btn" onclick="filtrarProductos('Antioxidantes', this)">Antioxidantes</button>
    </nav>

    <!-- Grid de productos -->
    <section>
      <h2>Productos</h2>
      <div id="productos-grid" class="grid"></div>
    </section>

    <!-- Grid de sucursales -->
    <section>
      <h2>Sucursales</h2>
      <div id="sucursales-grid" class="grid"></div>
    </section>

    <!-- Chatbot -->
    <section id="chatbot">
      <h2>Asistente RedNatura</h2>
      <div id="chat-window"></div>
      <div id="chat-controls">
        <input type="text" id="chat-input" placeholder="Escribe aquí...">
        <button id="send-btn">Enviar</button>
      </div>
    </section>

    <!-- Formulario de registro -->
    <section id="registro" style="display:none;">
      <h2>Registro de compra</h2>
      <form id="registro-form">
        <label>Nombre:</label>
        <input type="text" id="nombre" required>
        <label>Apellidos:</label>
        <input type="text" id="apellidos" required>
        <label>Teléfono:</label>
        <input type="tel" id="telefono" required>
        <label>Lugar de nacimiento:</label>
        <input type="text" id="lugar" required>
        <label>Fecha de nacimiento:</label>
        <input type="date" id="fecha" required>
        <button type="submit">Enviar registro</button>
      </form>
      <p>🎁 Al registrarte obtienes <strong>30% de descuento</strong> en compras mayores a $350 MXN.</p>
    </section>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>© 2026 RedNatura - Todos los derechos reservados</p>
  </footer>

  <!-- Scripts -->
  <script src="js/productos.js"></script>
  <script src="js/sucursales.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
