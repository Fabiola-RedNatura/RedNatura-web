<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot RedNatura - Prueba</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .chatbot-container { 
      width: 350px; 
      height: 500px; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      background: #fff; 
      position: fixed; 
      bottom: 20px; 
      right: 20px; 
      display: flex; 
      flex-direction: column; 
    }
    .chatbot-header { 
      background: #4CAF50; 
      color: white; 
      padding: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .chat-messages { 
      flex: 1; 
      padding: 10px; 
      overflow-y: auto; 
    }
    .message.bot { background: #e0f7e9; padding: 8px; margin: 5px; border-radius: 6px; }
    .message.user { background: #d0e0ff; padding: 8px; margin: 5px; border-radius: 6px; text-align: right; }
    .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ccc; }
    .chat-input-area input { flex: 1; padding: 6px; }
    .chat-input-area button { margin-left: 6px; }
    .options { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .options button { background: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .options button:hover { background: #45a049; }
  </style>
</head>
<body>
  <button onclick="toggleChat()">💬 Abrir Chat</button>

  <div id="chatbot" class="chatbot-container hidden">
    <div class="chatbot-header">
      <h3>🤖 Asistente RedNatura</h3>
      <button onclick="toggleChat()">✕</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Escribe tu pregunta..." onkeypress="handleChatInput(event)">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    let estado = 'inicial';

    function toggleChat() {
      const chatbot = document.getElementById('chatbot');
      chatbot.classList.toggle('hidden');
      if (!chatbot.classList.contains('hidden') && estado === 'inicial') {
        mostrarMensajeBot("¡Hola! 👋 Bienvenido a RedNatura. Soy tu asistente IA.", [
          { texto: "Ver catálogo", accion: () => mostrarCategorias() },
          { texto: "Ubicar sucursal", accion: () => mostrarMensajeBot("📍 Dime tu ciudad o estado para mostrarte la sucursal más cercana.") },
          { texto: "Cómo comprar", accion: () => mostrarMensajeBot("📦 Para comprar: 1️⃣ Elige productos 2️⃣ Regístrate 3️⃣ Confirmamos tu pedido 4️⃣ Recibes en casa o sucursal.") }
        ]);
        estado = 'esperando_opcion';
      }
    }

    function mostrarCategorias() {
      mostrarMensajeBot("📋 Selecciona una categoría:", [
        { texto: "Digestión", accion: () => mostrarMensajeBot("💚 Productos digestivos: PROBI GO!, FEMBALAZ, OXIALOE NF") },
        { texto: "Peso", accion: () => mostrarMensajeBot("⚖️ Productos para control de peso: LEVIUS, LEVIUS NIGHT, Gummys RedNatura") },
        { texto: "Energía", accion: () => mostrarMensajeBot("⚡ Productos energéticos: BLUNNER NF, MUSH KAFFI, PRO SHAKE") },
        { texto: "Belleza", accion: () => mostrarMensajeBot("💎 Productos de belleza: RENAISS NF, RENAISS SERUM, RENAISS CREAM") },
        { texto: "Inmunidad", accion: () => mostrarMensajeBot("🛡️ Productos para inmunidad: ZENDRA, SERENTRA, UC-II NF") }
      ]);
    }

    function mostrarMensajeBot(mensaje, opciones=[]) {
      const messagesDiv = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.textContent = mensaje;

      if (opciones.length > 0) {
        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'options';
        opciones.forEach(opcion => {
          const btn = document.createElement('button');
          btn.textContent = opcion.texto;
          btn.onclick = opcion.accion;
          buttonsDiv.appendChild(btn);
        });
        messageDiv.appendChild(buttonsDiv);
      }

      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function mostrarMensajeUsuario(mensaje) {
      const messagesDiv = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message user';
      messageDiv.textContent = mensaje;
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleChatInput(event) {
      if (event.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const mensaje = input.value.trim();
      if (!mensaje) return;
      mostrarMensajeUsuario(mensaje);
      input.value = '';
      mostrarMensajeBot("No entendí bien tu pregunta. 🤔 Usa los botones para navegar.");
    }
  </script>
</body>
</html>
