<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .producto-detalle {
      display: flex;
      flex-direction: row;
      gap: 30px;
      margin: 40px auto;
      max-width: 1100px;
    }
    .producto-img-left {
      flex: 1;
    }
    .producto-img-left img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .producto-info-right {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .producto-info-right h1 {
      margin-bottom: 15px;
      font-size: 2rem;
      color: #2c3e50;
    }
    .producto-info-right p, .producto-info-right li {
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .btn-comprar {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 1rem;
    }
    .btn-comprar:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html">⬅ Volver al catálogo</a>
    </div>
  </nav>

  <!-- Layout producto -->
  <div class="producto-detalle">
    <div class="producto-img-left">
      <!-- Ejemplo: zendra.png -->
      <img id="imagen" alt="Imagen producto">
    </div>
    <div class="producto-info-right">
      <h1 id="nombre"></h1>
      <p id="descripcion"></p>
      <p><strong>Presentación:</strong> <span id="presentacion"></span></p>
      <h3>Ingredientes</h3>
      <ul id="ingredientes"></ul>
      <h3>Beneficios</h3>
      <ul id="beneficios"></ul>
      <h3>Modo de uso</h3>
      <p id="uso"></p>
      <p><strong>Precio:</strong> <span id="precio"></span></p>
      <p id="promocion"></p>
      <button class="btn-comprar" onclick="abrirRegistro()">Comprar</button>
    </div>
  </div>

  <script src="js/productos.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const producto = productos.find(p => p.id === id);

    if (producto) {
      document.getElementById('nombre').textContent = producto.nombre;
      document.getElementById('imagen').src = `img/${producto.nombre.toLowerCase().replace(/ /g,'-')}.png`; 
      document.getElementById('descripcion').textContent = producto.descripcion;
      document.getElementById('presentacion').textContent = producto.presentacion;
      document.getElementById('uso').textContent = producto.modoUso;
      document.getElementById('precio').textContent = producto.precio;

      // Ingredientes
      producto.ingredientes.forEach(i => {
        const li = document.createElement('li');
        li.textContent = i;
        document.getElementById('ingredientes').appendChild(li);
      });

      // Beneficios
      producto.beneficios.forEach(b => {
        const li = document.createElement('li');
        li.textContent = b;
        document.getElementById('beneficios').appendChild(li);
      });

      // Promoción si el precio es mayor a 350
      const precioNum = parseFloat(producto.precio.replace('$','').replace(',',''));
      if (precioNum > 350) {
        document.getElementById('promocion').textContent = "🎉 Promoción: 30% de descuento al registrarte como cliente preferente.";
      }
    }

    function abrirRegistro() {
      const modal = window.opener?.document.getElementById('registro-modal') || document.getElementById('registro-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('show');
      } else {
        alert("Registro disponible en la página principal.");
      }
    }
  </script>
</body>
</html>
