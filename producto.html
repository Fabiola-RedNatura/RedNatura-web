<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - RedNatura</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .producto-detalle {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      margin: 40px auto;
      max-width: 1100px;
      padding: 0 20px;
    }

    .producto-img-left {
      flex: 1 1 320px;
    }

    .producto-img-left img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      background: white;
      object-fit: contain;
    }

    .producto-info-right {
      flex: 2 1 400px;
      display: flex;
      flex-direction: column;
    }

    .producto-info-right h1 {
      margin-bottom: 15px;
      font-size: 2rem;
      color: #2c3e7f;
    }

    .producto-info-right p,
    .producto-info-right li {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .btn-comprar {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 1rem;
      font-weight: bold;
    }

    .btn-comprar:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">⬅ Volver al catálogo</a>
    </div>
  </nav>

  <div class="producto-detalle">
    <div class="producto-img-left">
      <img id="imagen" alt="Imagen del producto">
    </div>

    <div class="producto-info-right">
      <h1 id="nombre"></h1>
      <p id="descripcion"></p>
      <p><strong>Presentación:</strong> <span id="presentacion"></span></p>

      <h3>Ingredientes</h3>
      <ul id="ingredientes"></ul>

      <h3>Beneficios</h3>
      <ul id="beneficios"></ul>

      <h3>Modo de uso</h3>
      <p id="uso"></p>

      <p><strong>Precio:</strong> <span id="precio"></span></p>
      <p id="promocion"></p>

      <button class="btn-comprar" id="btn-comprar">Comprar por WhatsApp</button>
    </div>
  </div>

  <script src="js/productos.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const producto = productos.find(p => p.id === id);

    if (producto) {
      document.getElementById('nombre').textContent = producto.nombre;
      document.getElementById('imagen').src = producto.imagen;
      document.getElementById('imagen').alt = producto.nombre;
      document.getElementById('descripcion').textContent = producto.descripcionLarga || producto.descripcion;
      document.getElementById('presentacion').textContent = producto.presentacion;
      document.getElementById('uso').textContent = producto.modoUso;
      document.getElementById('precio').textContent = producto.precio;

      producto.ingredientes.forEach(i => {
        const li = document.createElement('li');
        li.textContent = i;
        document.getElementById('ingredientes').appendChild(li);
      });

      producto.beneficios.forEach(b => {
        const li = document.createElement('li');
        li.textContent = b;
        document.getElementById('beneficios').appendChild(li);
      });

      const precioNum = parseFloat(producto.precio.replace('$', '').replace(/,/g, ''));
      if (!isNaN(precioNum) && precioNum > 350) {
        document.getElementById('promocion').textContent =
          "🎉 Promoción: 30% de descuento al registrarte como cliente preferente.";
      }

      document.getElementById('btn-comprar').addEventListener('click', () => {
        const numero = "525555070734";
        const mensaje = encodeURIComponent(
          `Hola, me interesa comprar el producto ${producto.nombre}. ¿Me puedes dar más información?`
        );
        window.open(`[wa.me](https://wa.me/${numero}?text=${mensaje})`, '_blank');
      });
    } else {
      document.body.innerHTML = "<h2 style='text-align:center; margin-top:40px;'>Producto no encontrado</h2>";
    }
  </script>
</body>
</html>
