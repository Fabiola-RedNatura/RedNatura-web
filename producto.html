<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .producto-detalle {
      display: flex;
      flex-direction: row;
      gap: 20px;
      margin: 40px auto;
      max-width: 1000px;
    }
    .producto-img-left {
      flex: 1;
    }
    .producto-img-left img {
      width: 100%;
      border-radius: 10px;
    }
    .producto-info-right {
      flex: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .producto-info-right h1 {
      margin-bottom: 15px;
    }
    .producto-info-right p {
      margin-bottom: 10px;
    }
    .btn-comprar {
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-comprar:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html">⬅ Volver al catálogo</a>
    </div>
  </nav>

  <!-- Layout producto -->
  <div class="producto-detalle">
    <div class="producto-img-left">
      <img id="imagen" alt="Imagen producto">
    </div>
    <div class="producto-info-right">
      <h1 id="nombre"></h1>
      <p id="descripcion"></p>
      <h3>Ingredientes</h3>
      <ul id="ingredientes"></ul>
      <h3>Modo de uso</h3>
      <p id="uso"></p>
      <p><strong>Precio:</strong> <span id="precio"></span></p>
      <p id="promocion"></p>
      <button class="btn-comprar" onclick="abrirRegistro()">Comprar</button>
    </div>
  </div>

  <script src="js/productos.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const producto = productos.find(p => p.id === id);

    if (producto) {
      document.getElementById('nombre').textContent = producto.nombre;
      document.getElementById('imagen').src = `img/${producto.id}.png`;
      document.getElementById('descripcion').textContent = producto.descripcion;

      // Ingredientes
      const listaIng = document.getElementById('ingredientes');
      (producto.ingredientes || ["Información no disponible"]).forEach(i => {
        const li = document.createElement('li');
        li.textContent = i;
        listaIng.appendChild(li);
      });

      // Modo de uso
      document.getElementById('uso').textContent = producto.uso || "Consultar indicaciones en el envase.";

      // Precio
      document.getElementById('precio').textContent = `$${producto.precio.toLocaleString('es-MX')}`;

      // Promoción
      if (producto.precio > 350) {
        document.getElementById('promocion').textContent = "🎉 Promoción: 30% de descuento al registrarte como cliente preferente.";
      }
    }

    function abrirRegistro() {
      const modal = window.opener?.document.getElementById('registro-modal') || document.getElementById('registro-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('show');
      } else {
        alert("Registro disponible en la página principal.");
      }
    }
  </script>
</body>
</html>
